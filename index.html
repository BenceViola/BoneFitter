<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fit lines, planes, spheres and cylinders to STL and PLY meshes of bones, in the browser.">
<title>BoneFitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: object list and measurements on the left; on the right a toolbar
     above the 3D view. Colours and type are those of Landmarker3D, so the
     tools look like one family. */
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --fg: #1a1e26;
    --muted: #5b6372;
    --line: #dce0e7;
    --accent: #2a52c4;
    --accent-fg: #ffffff;
    --accent-soft: #e7edfb;
    --viewport: #e6e9ee;
    --danger: #a8261d;
    --danger-bg: #fbebeb;
    --note-bg: #f9eeda;
    --note-fg: #6b4a0d;
    --selected: #e0337a;

    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --surface: #1b1f26;
      --fg: #e6e9ef;
      --muted: #9ba3b1;
      --line: #2b313b;
      --accent: #8ba7ff;
      --accent-fg: #0c1120;
      --accent-soft: #1f2840;
      --viewport: #0e1115;
      --danger: #ff9a90;
      --danger-bg: #3a1d1d;
      --note-bg: #3a2f17;
      --note-fg: #f2d79c;
      --selected: #ff6aa5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c;
    --surface: #1b1f26;
    --fg: #e6e9ef;
    --muted: #9ba3b1;
    --line: #2b313b;
    --accent: #8ba7ff;
    --accent-fg: #0c1120;
    --accent-soft: #1f2840;
    --viewport: #0e1115;
    --danger: #ff9a90;
    --danger-bg: #3a1d1d;
    --note-bg: #3a2f17;
    --note-fg: #f2d79c;
    --selected: #ff6aa5;
    color-scheme: dark;
  }

  /* Declared here, not left to the host: on a plain host (GitHub Pages) the
     busy overlay and messages would otherwise never hide. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
  }
  .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .app {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    height: 100%;
  }

  /* ---- Left: objects and properties ---- */
  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow-x: hidden; /* nothing may slide under the 3D view, which would swallow its clicks */
    border-right: 1px solid var(--line);
  }
  .brand { padding: 16px 16px 12px max(16px, env(safe-area-inset-left, 0px)); }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand .ver { font-family: var(--font-data); font-size: 11px; font-weight: 400; color: var(--muted); }

  .panel h2 {
    margin: 0;
    padding: 10px 16px 6px max(16px, env(safe-area-inset-left, 0px));
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .objects { flex: 1 1 0; min-height: 120px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .tree-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px max(8px, env(safe-area-inset-left, 0px)); }
  .properties { flex: 0 1 auto; max-height: 60%; overflow-y: auto; border-top: 1px solid var(--line); padding-bottom: 12px; }

  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-left: calc(var(--depth, 0) * 16px);
    border-radius: var(--radius);
  }
  .tree-row:hover { background: var(--accent-soft); }
  .tree-row.is-selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--selected); }
  .tree-row.is-off .tree-name { color: var(--muted); }
  .tree-row button {
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  .twist, .eye, .twist-gap { flex: none; width: 24px; height: 30px; display: grid; place-items: center; padding: 0; color: var(--muted); }
  .eye { width: 30px; }
  .twist svg { transition: transform 0.12s; }
  .twist[aria-expanded="true"] svg { transform: rotate(90deg); }
  .tree-name {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 4px;
    text-align: left;
    font-size: 13px;
  }
  .tree-name .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-name .count { margin-left: auto; font: 11.5px var(--font-data); color: var(--muted); }
  .tree-name .count.problem { color: var(--danger); font-weight: 500; }
  .tree-name .icon { flex: none; color: var(--muted); }
  .tree-row[data-status="placed"] .icon { color: #2f63e0; }
  .tree-row[data-status="estimated"] .icon { color: #d98a00; }
  .tree-row.is-selected .icon { color: var(--selected); }
  .icon, .twist svg, .eye svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .tree-empty, .props-empty { margin: 0; padding: 4px 16px 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--muted); }
  .tree-empty { padding-left: 8px; }

  .props-head { display: flex; align-items: center; gap: 8px; padding: 0 16px 0 max(16px, env(safe-area-inset-left, 0px)); }
  .props-head input { flex: 1; min-width: 0; }
  .props-kind { padding: 2px 16px 6px max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; color: var(--muted); }
  .props-list { margin: 0; padding: 0 16px 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13px; }
  .props-list dt { color: var(--muted); }
  .props-list dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .props-list dd.mono { font-size: 12px; }
  .props-more { display: flex; flex-direction: column; gap: 4px; padding: 10px 16px 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; color: var(--muted); }
  .props-list dd.problem { text-align: left; color: var(--danger); }
  .props-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 0 max(16px, env(safe-area-inset-left, 0px)); }

  /* ---- Buttons, inputs, messages ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--fg);
    font: 500 13px/1 var(--font-body);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { min-height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn.tool { gap: 6px; }
  .btn.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { color: var(--muted); border-color: var(--line); cursor: default; opacity: 0.6; }
  .btn:focus-visible, input:focus-visible, select:focus-visible, .tree-row button:focus-visible, .viewbar button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .file-input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="text"], select {
    min-height: 30px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--fg);
    font: 500 13px/1.35 var(--font-body);
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0 16px 12px max(16px, env(safe-area-inset-left, 0px));
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 13px;
  }
  .message.error { background: var(--danger-bg); color: var(--danger); }
  .message.note { background: var(--note-bg); color: var(--note-fg); }
  .message p { margin: 0; }
  .message .btn { align-self: flex-start; background: transparent; border-color: currentColor; color: inherit; }

  /* ---- Right: toolbar and 3D view ---- */
  .work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px calc(12px + env(safe-area-inset-right, 0px)) 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .toolbar .spacer { flex: 1; }
  /* One menu per kind of object, each listing the ways to make it. */
  .menus { display: flex; flex-wrap: wrap; gap: 6px; }
  .menu { position: relative; }
  .menu-btn { gap: 6px; }
  .menu-btn .caret { width: 10px; height: 10px; margin-left: 1px; color: var(--muted); }
  .menu-btn[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .menu-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    min-width: 190px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: 0 6px 18px rgb(0 0 0 / 0.16);
  }
  .menu-list button {
    padding: 7px 10px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--fg);
    font: 500 13px/1.2 var(--font-body);
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }
  .menu-list button:hover, .menu-list button:focus-visible { background: var(--accent-soft); outline: none; }

  /* The rail: what the mouse does in the 3D view. Beside the view, never over the mesh. */
  .stage-row { display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
  .rail {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 5px 6px 6px;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  .rail-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    width: 48px;
    padding: 7px 0 5px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: none;
    color: var(--fg);
    font: 500 10.5px/1 var(--font-body);
    cursor: pointer;
  }
  .rail-btn .icon { width: 18px; height: 18px; }
  .rail-btn:hover { background: var(--accent-soft); }
  .rail-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .rail-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .viewbar { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius); }
  .viewbar button {
    min-width: 30px;
    height: 28px;
    padding: 0 6px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--fg);
    font: 500 12px var(--font-data);
    cursor: pointer;
  }
  .viewbar button:hover { background: var(--accent-soft); }
  .viewbar .sep { width: 1px; margin: 4px 2px; background: var(--line); }
  .viewbar .fit { font-family: var(--font-body); }

  .stage {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    background: var(--viewport);
    overflow: hidden;
    touch-action: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    pointer-events: none;
  }
  .stage.is-drawing canvas, .stage.is-selecting canvas { cursor: crosshair; }
  .select-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  .select-overlay path { fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 3; }
  .btn.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .tool-strip.is-paused { background: var(--note-bg); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .tool-strip #select-hint { flex: 1 1 260px; }
  /* The buttons of the tool in use, in a row of their own under the toolbar,
     so they never cover the mesh. */
  .tool-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 6px calc(12px + env(safe-area-inset-right, 0px)) 6px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--accent-soft);
    font-size: 13px;
  }
  .tool-strip #tool-hint, .tool-strip #prompt-text, .tool-strip #point-hint { flex: 1 1 260px; }
  .stage.is-placing canvas { cursor: crosshair; }
  /* The View menu: the axis views two by two, then Fit. */
  .menu-list.view-list { left: auto; right: 0; min-width: 0; }
  .view-list .viewbar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; border: 0; padding: 0; }
  .view-list .viewbar button { min-width: 64px; }
  .view-list .viewbar .sep { display: none; }
  .view-list .viewbar .fit { grid-column: 1 / -1; white-space: nowrap; }
  .stage.is-picking canvas { cursor: pointer; }
  .props-make { padding: 10px 16px 0 max(16px, env(safe-area-inset-left, 0px)); }
  .props-make .props-actions { padding: 4px 0 0; }
  .props-make-label { font-size: 12px; color: var(--muted); }
  .tool-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .space-note {
    position: absolute;
    left: 12px;
    bottom: 10px;
    margin: 0;
    font-family: var(--font-data);
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  .busy {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--viewport) 70%, transparent);
  }
  .busy-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .drop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    pointer-events: none;
  }
  .drop-box {
    padding: 28px 36px;
    border: 2px dashed var(--accent);
    border-radius: 10px;
    background: var(--surface);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    color: var(--accent);
  }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
    .work { order: -1; }
    .panel { border-right: 0; }
    .objects { flex: none; }
    .tree-scroll, .properties { overflow: visible; max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .twist svg { transition: none; }
    .spinner { animation-duration: 2.4s; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <h1>BoneFitter <span class="ver">v0.10</span></h1>
    </header>

    <div id="message" class="message" role="alert" hidden></div>

    <section class="objects" aria-labelledby="objects-h">
      <h2 id="objects-h">Objects</h2>
      <div class="tree-scroll" id="tree"></div>
    </section>

    <section class="properties" aria-labelledby="props-h">
      <h2 id="props-h">Properties</h2>
      <div id="properties"></div>
    </section>
  </aside>

  <div class="work">
    <div class="toolbar" role="toolbar" aria-label="Tools">
      <input type="file" id="file-input" class="file-input" accept=".stl,.ply,.json" multiple>
      <label for="file-input" class="btn primary" title="Open meshes (STL, PLY) and landmark files (.lmk.json)">Open…</label>
      <div class="menus" id="menus"></div>
      <span class="spacer"></span>
      <div class="menu">
        <button type="button" class="btn tool menu-btn" id="view-menu" aria-haspopup="menu" aria-expanded="false" title="Look along an axis, or fit everything in view">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>View
          <svg class="icon caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg>
        </button>
        <div class="menu-list view-list" role="menu" aria-label="View" hidden>
      <div class="viewbar" role="group" aria-label="View along the axes">
        <button type="button" data-view="+x" title="View from +X">+X</button>
        <button type="button" data-view="-x" title="View from −X">−X</button>
        <button type="button" data-view="+y" title="View from +Y">+Y</button>
        <button type="button" data-view="-y" title="View from −Y">−Y</button>
        <button type="button" data-view="+z" title="View from +Z">+Z</button>
        <button type="button" data-view="-z" title="View from −Z">−Z</button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="fit" id="fit-btn" title="Fit everything in the view (F)">Fit everything in view</button>
      </div>
        </div>
      </div>
    </div>

    <div class="tool-strip" id="tool-strip" role="group" aria-label="Curve tool" hidden>
      <span id="tool-hint" aria-live="polite"></span>
      <span class="tool-buttons">
        <button type="button" class="btn small" id="curve-finish" title="Finish the curve as it is (Enter)">Finish</button>
        <button type="button" class="btn small" id="curve-close" title="Join the last point to the first (C)">Close loop</button>
        <button type="button" class="btn small" id="curve-undo" title="Take the last point off again (Backspace)">Undo point</button>
        <button type="button" class="btn small" id="curve-cancel" title="Remove the curve being drawn (Esc)">Cancel</button>
      </span>
    </div>

    <div class="tool-strip" id="point-strip" role="group" aria-label="Point tool" hidden>
      <span id="point-hint" aria-live="polite"></span>
      <span class="tool-buttons">
        <button type="button" class="btn small" id="point-done" title="Stop placing points (Esc)">Done</button>
      </span>
    </div>

    <div class="tool-strip" id="prompt-strip" role="group" aria-label="Making an object" hidden>
      <span id="prompt-text" aria-live="polite"><strong id="prompt-title"></strong> <span id="prompt-hint"></span></span>
      <span class="tool-buttons">
        <button type="button" class="btn small" id="prompt-cancel" title="Stop without making anything (Esc)">Cancel</button>
      </span>
    </div>

    <div class="tool-strip" id="select-strip" role="group" aria-label="Selection tool" hidden>
      <span id="select-hint" aria-live="polite"></span>
      <span class="tool-buttons">
        <label class="check"><input type="checkbox" id="select-through"> Select through the surface</label>
        <button type="button" class="btn small toggle" id="select-turn" aria-pressed="false" title="Turn the view, then come back to selecting (Esc)">Turn view</button>
        <button type="button" class="btn small" id="select-done" title="Leave the selection tool">Done</button>
      </span>
    </div>

    <div class="stage-row">
    <div class="rail" role="toolbar" aria-label="What the mouse does in the 3D view" aria-orientation="vertical">
      <button type="button" class="rail-btn" id="pointer-btn" aria-pressed="true" title="Select: click an object in the 3D view to select it; drag to turn the view">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v10l2.6-2.3 1.7 3.6 1.6-.8-1.7-3.5 3.3-.2z"/></svg>Select
      </button>
      <button type="button" class="rail-btn" id="curve-btn" aria-pressed="false" title="Curve: draw a curve on a mesh by clicking points on it">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12c2-8 4-8 6-3s4 4 6-5"/></svg>Curve
      </button>
      <button type="button" class="rail-btn" id="point-btn" aria-pressed="false" title="Point: place points by clicking on a mesh">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.6" fill="currentColor" stroke="none"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/></svg>Point
      </button>
      <button type="button" class="rail-btn" id="lasso-btn" aria-pressed="false" title="Lasso: select part of a mesh by drawing round it">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5c3.6 0 6.5 1.8 6.5 4s-2.9 4-6.5 4c-1 0-2-.1-2.8-.4M3 8.6C2 7.9 1.5 7.2 1.5 6.5c0-2.2 2.9-4 6.5-4"/><path d="M4.5 9.5c-1.2.6-1.5 2-.6 3 .7.7 1.8.6 2.4 0"/></svg>Lasso
      </button>
      <button type="button" class="rail-btn" id="box-btn" aria-pressed="false" title="Box: select part of a mesh by dragging a box over it">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" stroke-dasharray="2 1.5"/></svg>Box
      </button>
    </div>
    <main class="stage" id="stage" aria-label="3D view">
      <svg class="select-overlay" id="select-overlay" aria-hidden="true" hidden><path id="select-path"/></svg>
      <p class="stage-empty" id="stage-empty" hidden>Open STL or PLY meshes, or drop them here.</p>
      <p class="space-note" id="space-note"></p>
      <div class="busy" id="busy" hidden>
        <div class="busy-box"><span class="spinner" aria-hidden="true"></span><span id="busy-text"></span></div>
      </div>
    </main>
    </div>
  </div>
</div>

<div class="drop" id="drop" hidden><div class="drop-box">Drop meshes or landmark files</div></div>
